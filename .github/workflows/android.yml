# Builds a debug APK in the cloud (no Android Studio needed). Push to GitHub, open the Actions tab,
# run "Build Android APK", then download the app-debug apk from the run's Artifacts.
name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
        if: hashFiles('android/gradlew') == ''
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0c10' --splashBackgroundColor '#0b0c10'
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ironpath-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
